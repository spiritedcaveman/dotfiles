## Backend: xrender is faster for 2D/Terminal work on Intel iGPUs
#backend = "xrender";
#vsync = true;
#
## Disable animations/shadows for maximum snappiness
#shadow = false;
#fading = false;
#blur-background = false;
#
## Detect window properties properly
#mark-wmwin-focused = true;
#mark-ovl-focused = true;
#detect-client-opacity = true;
#detect-transient = true;
#use-damage = true;
#
## Log level
#log-level = "warn";
#

# --- Backend Settings ---
# Since we fixed your drivers, we use glx (Hardware Acceleration)
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;

# --- Transparency / Opacity ---
# Keeps Alacritty slightly transparent while keeping the active window focused
inactive-opacity = 0.90;
frame-opacity = 1.0;
inactive-opacity-override = false;
active-opacity = 1.0;

# Focus settings: slightly dim inactive windows to guide the eye
focus-exclude = [ "class_g = 'Cairo-clock'" ];
opacity-rule = [
  "100:class_g = 'Alacritty' && focused",
  "85:class_g = 'Alacritty' && !focused"
];

# --- Fading (Subtle, not sluggish) ---
fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;

# --- Shadow (Industrial look) ---
shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- Corner Rounding (Optional - set to 0 for sharp edges) ---
corner-radius = 0;

# --- VSync (Critical for tearing-free Vim scrolling) ---
vsync = true;
dbe = false;

# --- Window Type Settings ---
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.8; }
  dropdown_menu = { opacity = 0.8; }
};

