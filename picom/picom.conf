# Backend: xrender is faster for 2D/Terminal work on Intel iGPUs
backend = "glx";
vsync = true;

# Disable animations/shadows for maximum snappiness
shadow = false;
fading = false;
blur-background = false;

# Detect window properties properly
mark-wmwin-focused = true;
mark-ovl-focused = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = false;

# Log level
log-level = "warn";
