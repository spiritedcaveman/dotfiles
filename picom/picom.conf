# the engine? 

backend = "glx";
vsync = true;

# Intel UHD
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
xrender-sync-fence = true;
use-damage = false;  # This kills the btop menu tearing


# extra smoothness with GLX
# glx-no-stencil = true;
glx-copy-from-front = false;
# glx-no-rebind-pixmap = true;

# The "Ghost" effect for inactive windows
inactive-opacity = 0.85;
active-opacity = 1.0;
frame-opacity = 1.0;

# Let specific apps stay 100% solid (optional)
opacity-rule = [
    "100:class_g = 'mpv'",
    "100:class_g = 'Firefox'"
];



# Disable animations/shadows for maximum snappiness
shadow = false;
fading = false;
blur-background = false;

# Detect window properties properly
mark-wmwin-focused = true;
mark-ovl-focused = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

# Log level
log-level = "warn";
