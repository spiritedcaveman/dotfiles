music_directory     "/mnt/music"
db_file             "/home/spiritedcaveman/.config/mpd/database"
log_file            "/home/spiritedcaveman/.config/mpd/log"
state_file          "/home/spiritedcaveman/.config/mpd/state"

bind_to_address     "127.0.0.1"
port                "6600"

# 1. Disable automatic filesystem watching to stop the memory leak
auto_update         "no"

# 2. Hard cap the buffer size so it can never balloon into gigabytes
max_output_buffer_size "32768"

audio_output {
    type            "pipewire"
    name            "PipeWire Sound Server"
}

audio_output {
    type            "fifo"
    name            "my_fifo"
    path            "/tmp/mpd.fifo"
    format          "44100:16:2"
}

# 3. Silence the wildmidi missing timidity.cfg warning
decoder {
    plugin          "wildmidi"
    enabled         "no"
}
