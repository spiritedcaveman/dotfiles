# ================================================================
# GENERAL SETTINGS
# ================================================================

set -g default-terminal "tmux-256color"
# set -ga terminal-overrides ",xterm-256color:Tc"
setw -g mode-keys vi
set -g mouse on
# Alternatives 
# set -g mouse on            " Enable mouse support if needed
# set -g default-terminal "screen-256color"  " fallback for older terminals

# Performance / behavior
set -g escape-time 0
set -g repeat-time 300      # allow holding keys for repeat
set -g focus-events on
set -g history-limit 100000

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on


# ================================================================
# DESERT THEME STATUS BAR
# ================================================================

# Dark charcoal background to blend with Desert
set -g status-style bg='#333333',fg='#d1d1d1'
#set -g status-style bg=colour235,fg=colour136

# Left side: Khaki session name
set -g status-left-length 20
set -g status-left "#[fg=colour180,bold] #S #[fg=colour239]| "

# Right side: Muted Green date/time
set -g status-right ""

# Center the window list
set -g status-justify centre

# Toggle Status Bar
bind b set-option status

# Active Window: Maroon / Indian Red (Desert highlight)
set -g window-status-format " #I:#W#F "
set -g window-status-current-format " #I:#W#F "
set -g window-status-current-style bg='#800000',fg='#eeeeee',bold


# ================================================================
# KEY BINDINGS
# ================================================================

# Reload config quickly
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config Reloaded"

#prefix
# unbind C-b
set -g prefix C-space
bind C-space send-prefix


# ================================================================
# Pane splits
# ================================================================

bind | split-window -h -c "#{pane_current_path}"     # Horizontal split
bind - split-window -v -c "#{pane_current_path}"    # Vertical split


# ================================================================
# Pane resizing
# ================================================================

# Preferred: Alt + hjkl (repeatable, no prefix, reliable)
bind -n M-h resize-pane -L 1
bind -n M-j resize-pane -D 1
bind -n M-k resize-pane -U 1
bind -n M-l resize-pane -R 1

# Optional: Ctrl + Arrow keys (terminal / WM dependent)
bind -n C-Up    resize-pane -U 1
bind -n C-Down  resize-pane -D 1
bind -n C-Left  resize-pane -L 1
bind -n C-Right resize-pane -R 1


# ================================================================
# Copy-mode (vi)
# ================================================================

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Alternative / optional navigation:
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R


# Toggle pane synchronization with prefix + S
bind S setw synchronize-panes

# Stay in copy-mode after yanking
bind-key -T copy-mode-vi y send-keys -X copy-pipe "xclip -sel clip -i" \; send-keys -X clear-selection

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel






# ================================================================
# PLUGINS (TPM)
# ================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TPM (keep at very bottom)
run '~/.config/tmux/plugins/tpm/tpm'


